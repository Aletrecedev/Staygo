<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${apartamento.nombre} + ' - StayGO'">Detalle - StayGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 mb-5">
    <div class="row g-5">

        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-start mb-1">
                <h1 class="fw-bold mb-0" th:text="${apartamento.nombre}">Nombre del Apartamento</h1>
                <div class="d-none d-md-flex gap-2 mt-2">
                    <button class="btn btn-sm btn-light border-0 text-decoration-underline fw-bold"><i class="bi bi-box-arrow-up me-1"></i> Compartir</button>
                    <button class="btn btn-sm btn-light border-0 text-decoration-underline fw-bold"><i class="bi bi-heart me-1"></i> Guardar</button>
                </div>
            </div>

            <div class="d-flex align-items-center mb-3">
                <i class="bi bi-star-fill text-dark small me-1"></i>
                <span class="fw-bold me-3">4.9</span>
                <span class="text-muted text-decoration-underline"><i class="bi bi-geo-alt-fill me-1 text-primary"></i><span th:text="${apartamento.direccion}">Dirección</span></span>
            </div>

            <div class="rounded-4 overflow-hidden mb-4 shadow-sm border-0 position-relative">
                <img th:src="${apartamento.imagenUrl != null and !apartamento.imagenUrl.isEmpty()} ? ${apartamento.imagenUrl} : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80'"
                     class="img-fluid w-100"
                     style="height: 450px; object-fit: cover;"
                     th:alt="${apartamento.nombre}">
            </div>

            <div class="d-flex flex-wrap gap-4 text-dark mb-4 fs-6">
                <span><i class="bi bi-people fs-5 me-2"></i> Máx. <span th:text="${apartamento.capacidad != null ? apartamento.capacidad : '4'}">4</span> huéspedes</span>
                <span><i class="bi bi-door-closed fs-5 me-2"></i> Dormitorios privados</span>
                <span><i class="bi bi-droplet fs-5 me-2"></i> Baño completo</span>
                <span><i class="bi bi-wifi fs-5 me-2"></i> Wifi gratis</span>
            </div>


            <hr class="text-muted mb-4 opacity-25">

            <h4 class="fw-bold mb-3">Sobre este alojamiento</h4>
            <p class="fs-6 text-secondary lh-lg" style="white-space: pre-line;" th:text="${apartamento.descripcion}">Descripción completa aquí...</p>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-3 w-100 position-sticky" style="top: 100px;">
                <div class="card-body">
                    <div class="mb-4">
                        <span class="fs-3 fw-bold">€<span id="precioNoche" th:text="${apartamento.precioNoche}">0</span></span>
                        <span class="text-muted"> / noche</span>
                    </div>

                    <form th:action="@{/reservar}" method="post" class="d-flex flex-column gap-3">
                        <input type="hidden" name="idApartamento" th:value="${apartamento.idApartamento}">

                        <div class="border rounded-3 p-2 bg-white">
                            <div class="row g-0">
                                <div class="col-6 border-end p-2">
                                    <label class="small fw-bold text-uppercase text-muted" for="checkin">Llegada</label>
                                    <input type="text" id="checkin" name="fechaInicio" class="form-control border-0 p-0 shadow-none bg-transparent fw-bold"
                                           th:value="${param.fechaInicio}" placeholder="Añadir fecha" required>
                                </div>
                                <div class="col-6 p-2">
                                    <label class="small fw-bold text-uppercase text-muted" for="checkout">Salida</label>
                                    <input type="text" id="checkout" name="fechaFin" class="form-control border-0 p-0 shadow-none bg-transparent fw-bold"
                                           th:value="${param.fechaFin}" placeholder="Añadir fecha" required>
                                </div>
                            </div>
                        </div>

                        <div id="resumenPrecio" class="d-none mt-3">
                            <div class="d-flex justify-content-between text-muted mb-2">
                                <span>€<span th:text="${apartamento.precioNoche}"></span> x <span id="cantidadNoches">0</span> noches</span>
                                <span>€<span id="subtotal">0</span></span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span class="text-primary">€<span id="totalFinal">0</span></span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill py-3 mt-2 shadow-sm transition-all hover-scale">
                            Reservar ahora
                        </button>
                    </form>

                    <p class="text-center text-muted mt-3 small">No se te cobrará nada todavía</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script>
    flatpickr.localize(flatpickr.l10ns.es);

    const precioPorNoche = parseFloat(document.getElementById('precioNoche').innerText);

    function calcularTotal() {
        const checkinDate = checkinPicker.selectedDates[0];
        const checkoutDate = checkoutPicker.selectedDates[0];

        if (checkinDate && checkoutDate) {
            const diffTime = Math.abs(checkoutDate - checkinDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                const total = diffDays * precioPorNoche;
                document.getElementById('cantidadNoches').innerText = diffDays;
                document.getElementById('subtotal').innerText = total.toFixed(2);
                document.getElementById('totalFinal').innerText = total.toFixed(2);
                document.getElementById('resumenPrecio').classList.remove('d-none');
            }
        }
    }

    const checkoutPicker = flatpickr("#checkout", {
        altInput: true,
        altFormat: "j M Y",
        dateFormat: "Y-m-d",
        minDate: "today",
        onChange: calcularTotal
    });

    const checkinPicker = flatpickr("#checkin", {
        altInput: true,
        altFormat: "j M Y",
        dateFormat: "Y-m-d",
        minDate: "today",
        onChange: function(selectedDates) {
            if (selectedDates.length > 0) {
                let minCheckoutDate = new Date(selectedDates[0]);
                minCheckoutDate.setDate(minCheckoutDate.getDate() + 1);

                checkoutPicker.set("minDate", minCheckoutDate);
                setTimeout(() => checkoutPicker.open(), 100);
            }
            calcularTotal();
        }
    });

    setTimeout(calcularTotal, 500);
</script>
</body>
</html>
