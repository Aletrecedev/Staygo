<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO - Regístrate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container justify-content-center">
        <a class="navbar-brand d-flex align-items-center m-0" href="/">
            <img th:src="@{/img/logo.png}" alt="StayGO Logo" height="45" style="transform: scale(3.2); transform-origin: center;" class="d-inline-block align-text-top">
        </a>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <h3 class="fw-bold mb-4 text-center">Crea tu cuenta</h3>

        <div th:if="${param.errorEmail}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <strong>Ese correo electrónico ya está registrado.</strong> Por favor, inicia sesión o utiliza otro correo.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.errorPassword}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
            <i class="bi bi-shield-lock-fill me-2"></i> <strong>Contraseña demasiado débil.</strong> Debe tener al menos 8 caracteres, una mayúscula y un número.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">

            <div class="mb-4 p-3 bg-light rounded-3 border">
                <label class="form-label fw-bold small mb-2">¿Cómo quieres usar StayGO?</label>
                <select class="form-select p-2 fw-bold text-primary" th:field="*{rol}">
                    <option value="CLIENTE" selected> Soy Huésped (Quiero buscar alojamiento)</option>
                    <option value="PROPIETARIO"> Soy Anfitrión (Quiero publicar mi alojamiento)</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small">Nombre</label>
                    <input type="text" class="form-control p-2" th:field="*{nombre}"
                           minlength="2" maxlength="50"
                           pattern="[a-zA-ZÀ-ÿ\s]+"
                           title="El nombre solo puede contener letras y espacios" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold small">Apellidos</label>
                    <input type="text" class="form-control p-2" th:field="*{apellidos}"
                           minlength="2" maxlength="50"
                           pattern="[a-zA-ZÀ-ÿ\s]+"
                           title="Los apellidos solo pueden contener letras y espacios" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Nombre de Usuario</label>
                <input type="text" class="form-control p-2" th:field="*{nombreUsuario}"
                       minlength="4" maxlength="20"
                       pattern="[a-zA-Z0-9_]+"
                       title="Entre 4 y 20 caracteres. Solo letras, números y guiones bajos (sin espacios)." required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Correo electrónico</label>
                <input type="email" class="form-control p-2" th:field="*{email}" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small text-secondary mb-1">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-0"><i class="bi bi-lock"></i></span>

                    <input type="password" id="passwordInput" class="form-control p-3 bg-light border-0 ps-0" placeholder="Crea una contraseña segura"
                           th:field="*{contrasena}"
                           minlength="8" maxlength="64"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                           title="Debe contener al menos 8 caracteres, incluyendo al menos una letra mayúscula, una minúscula y un número."
                           required>

                    <button class="btn btn-light bg-light border-0 text-muted pe-3" type="button" id="btnTogglePassword">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <div class="form-text small text-muted">Mínimo 8 caracteres, con al menos una mayúscula y un número.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill">Registrarse</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small">¿Ya tienes una cuenta? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Inicia sesión</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('btnTogglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        // Comprobamos el tipo actual y lo cambiamos
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            // Cambiamos el icono a un ojo tachado
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            // Restauramos el icono del ojo normal
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        }
    });
</script>
</body>
</html>
