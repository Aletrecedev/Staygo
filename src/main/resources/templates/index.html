<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="hero-section">
    <div class="container">
        <h1 class="display-5 fw-bold mb-3">Encuentra tu apartamento perfecto</h1>
        <p class="lead fw-light mb-4">Descubre miles de apartamentos en las mejores ubicaciones del mundo</p>

        <form th:action="@{/buscar}" method="get" class="search-pill d-none d-lg-flex align-items-center text-start">

            <div class="flex-grow-1 px-4 divider">
                <label class="fw-bold small mb-0 text-dark">Ubicación</label>
                <div class="d-flex align-items-center">
                    <i class="bi bi-geo-alt text-muted me-2"></i>
                    <input type="text" name="ubicacion" list="destinosPopulares" class="form-control bg-transparent border-0 shadow-none p-0" placeholder="¿A dónde vas?" required>

                    <datalist id="destinosPopulares">
                        <option value="Madrid"></option>
                        <option value="Barcelona"></option>
                        <option value="Valencia"></option>
                        <option value="Sevilla"></option>
                    </datalist>
                </div>
            </div>

            <div class="px-4 divider" style="width: 200px;">
                <label class="fw-bold small mb-0 text-dark" for="checkin">Check-in</label>
                <div class="d-flex align-items-center">
                    <i class="bi bi-calendar text-muted me-2"></i>
                    <input type="text" id="checkin" name="fechaInicio" class="form-control search-input p-0 bg-transparent border-0 shadow-none" placeholder="Añade fechas">
                </div>
            </div>

            <div class="px-4 divider" style="width: 200px;">
                <label class="fw-bold small mb-0 text-dark" for="checkout">Check-out</label>
                <div class="d-flex align-items-center">
                    <i class="bi bi-calendar text-muted me-2"></i>
                    <input type="text" id="checkout" name="fechaFin" class="form-control search-input p-0 bg-transparent border-0 shadow-none" placeholder="Añade fechas">
                </div>
            </div>

            <div class="px-4" style="width: 180px;">
                <label class="fw-bold small mb-0 text-dark">Huéspedes</label>
                <div class="d-flex align-items-center">
                    <i class="bi bi-people text-muted me-2"></i>
                    <input type="number" name="huespedes" class="form-control search-input p-0 bg-transparent border-0 shadow-none" placeholder="¿Cuántos?" min="1">
                </div>
            </div>

            <div class="pe-2">
                <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
                    <i class="bi bi-search me-1"></i> Buscar
                </button>
            </div>

        </form>
    </div>
</div>

<div class="d-block d-lg-none mt-4 text-center">
    <a th:href="@{/explorar}" class="btn btn-light text-primary rounded-pill px-5 py-3 fw-bold shadow-sm">
        <i class="bi bi-search me-1"></i> Explorar Apartamentos
    </a>
</div>

<div class="container" style="margin-top: 50px; margin-bottom: 80px;">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-geo-alt text-primary fs-4 me-2"></i>
        <h4 class="fw-bold mb-0">Destinos populares</h4>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="destination-card bg-white p-3 rounded shadow-sm">
                <h6 class="fw-bold mb-1">Madrid</h6>
                <p class="text-muted small mb-0">1,234 apartamentos</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="destination-card bg-white p-3 rounded shadow-sm">
                <h6 class="fw-bold mb-1">Barcelona</h6>
                <p class="text-muted small mb-0">987 apartamentos</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="destination-card bg-white p-3 rounded shadow-sm">
                <h6 class="fw-bold mb-1">Valencia</h6>
                <p class="text-muted small mb-0">654 apartamentos</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="destination-card bg-white p-3 rounded shadow-sm">
                <h6 class="fw-bold mb-1">Sevilla</h6>
                <p class="text-muted small mb-0">432 apartamentos</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script>
    // Configuramos el idioma global a Español
    flatpickr.localize(flatpickr.l10ns.es);

    // Inicializamos el Check-out primero
    const checkoutPicker = flatpickr("#checkout", {
        altInput: true,
        altFormat: "j M Y", // Formato visual: 15 Abr 2024
        dateFormat: "Y-m-d", // Formato para Spring Boot: 2024-04-15
        minDate: "today", // No se puede viajar al pasado
    });

    // Inicializamos el Check-in
    const checkinPicker = flatpickr("#checkin", {
        altInput: true,
        altFormat: "j M Y",
        dateFormat: "Y-m-d",
        minDate: "today",
        onChange: function(selectedDates, dateStr, instance) {
            // Si el usuario selecciona una fecha de entrada...
            if (selectedDates.length > 0) {
                // 1. Calculamos el día siguiente
                let minCheckoutDate = new Date(selectedDates[0]);
                minCheckoutDate.setDate(minCheckoutDate.getDate() + 1);

                // 2. Bloqueamos el calendario de salida para que no sea anterior a la entrada
                checkoutPicker.set("minDate", minCheckoutDate);

                // 3. Abrimos automáticamente el calendario de salida
                setTimeout(() => {
                    checkoutPicker.open();
                }, 100);
            }
        }
    });
</script>
</body>
</html>
