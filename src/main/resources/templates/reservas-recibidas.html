<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO - Gestión de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h2 class="fw-bold mb-1">Reservas de huéspedes</h2>
            <p class="text-muted mb-0">Controla quién se aloja en tus propiedades.</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(reservas)}" class="alert alert-info border-0 shadow-sm rounded-4 py-4 text-center">
        <i class="bi bi-calendar-x fs-2 text-info mb-2 d-block"></i>
        Aún no has recibido ninguna reserva. ¡Asegúrate de tener buenas fotos en tus anuncios!
    </div>

    <div th:unless="${#lists.isEmpty(reservas)}" class="bg-white rounded-4 shadow-sm overflow-hidden">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th class="py-3 px-4">Huésped</th>
                <th class="py-3 px-4">Apartamento</th>
                <th class="py-3 px-4">Llegada</th>
                <th class="py-3 px-4">Salida</th>
                <th class="py-3 px-4 text-end">Ingresos</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reserva : ${reservas}">
                <td class="py-3 px-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person-circle fs-4 text-secondary me-2"></i>
                        <span class="fw-bold" th:text="${reserva.cliente.nombre}">Nombre Cliente</span>
                    </div>
                </td>
                <td class="py-3 px-4">
                    <span class="badge bg-primary rounded-pill mb-1" th:text="${reserva.apartamento.nombre}">Piso</span>
                </td>
                <td class="py-3 px-4 fw-bold text-success" th:text="${reserva.fechaInicio}">Fecha Inicio</td>
                <td class="py-3 px-4 fw-bold text-danger" th:text="${reserva.fechaFin}">Fecha Fin</td>
                <td class="py-3 px-4 text-end fw-bold fs-5">
                    €<span th:text="${reserva.precioTotal}">100</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
