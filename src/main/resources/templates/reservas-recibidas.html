<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO - Gestión de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-inboxes text-primary me-2"></i>Reservas de huéspedes</h2>
            <p class="text-muted mb-0">Controla quién se aloja en tus propiedades y gestiona tus ingresos.</p>
        </div>
        <a th:href="@{/apartamentos}" class="btn btn-outline-primary rounded-pill fw-bold">Mis alojamientos</a>
    </div>

    <div th:if="${#lists.isEmpty(reservas)}" class="alert alert-info border-0 shadow-sm rounded-4 py-4 text-center mt-4">
        <i class="bi bi-calendar-x fs-2 text-info mb-2 d-block"></i>
        Aún no has recibido ninguna reserva. ¡Asegúrate de tener buenas fotos en tus anuncios!
    </div>

    <div th:unless="${#lists.isEmpty(reservas)}" class="bg-white rounded-4 shadow-sm overflow-hidden">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th class="py-3 px-4 text-uppercase small text-muted">Huésped</th>
                <th class="py-3 px-4 text-uppercase small text-muted">Apartamento</th>
                <th class="py-3 px-4 text-uppercase small text-muted">Llegada</th>
                <th class="py-3 px-4 text-uppercase small text-muted">Salida</th>
                <th class="py-3 px-4 text-end text-uppercase small text-muted">Ingresos</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reserva : ${reservas}">
                <td class="py-3 px-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person-circle fs-3 text-secondary me-3"></i>
                        <div>
                            <span class="fw-bold d-block text-dark" th:text="${reserva.cliente.nombre} + ' ' + ${reserva.cliente.apellidos}">Nombre Cliente</span>
                            <small class="text-muted"><i class="bi bi-telephone text-success me-1"></i><span th:text="${reserva.cliente.telefono}">Teléfono</span></small>
                        </div>
                    </div>
                </td>

                <td class="py-3 px-4">
                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-2" th:text="${reserva.apartamento.nombre}">Piso</span>
                </td>

                <td class="py-3 px-4 fw-bold text-success" th:text="${#temporals.format(reserva.fechaInicio, 'dd/MM/yyyy')}">Fecha Inicio</td>

                <td class="py-3 px-4 fw-bold text-danger" th:text="${#temporals.format(reserva.fechaFin, 'dd/MM/yyyy')}">Fecha Fin</td>

                <td class="py-3 px-4 text-end fw-bold fs-5 text-dark">
                    €<span th:text="${reserva.precioTotal}">100</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
