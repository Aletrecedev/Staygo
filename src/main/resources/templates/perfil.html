<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - StayGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 mb-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">

            <h2 class="fw-bold mb-4">Información personal</h2>

            <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> Tus datos se han actualizado correctamente.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-fill fs-2"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0" th:text="${session.usuarioLogueado.nombre}">Nombre Usuario</h4>
                            <span class="badge bg-secondary mt-1" th:text="${session.usuarioLogueado.rol}">CLIENTE</span>
                        </div>
                    </div>

                    <form th:action="@{/perfil/actualizar}" method="post">
                        <input type="hidden" name="idUsuario" th:value="${session.usuarioLogueado.idUsuario}">

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Nombre completo</label>
                            <input type="text" class="form-control form-control-lg rounded-3" name="nombre" th:value="${session.usuarioLogueado.nombre}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Correo electrónico (No modificable)</label>
                            <input type="email" class="form-control form-control-lg rounded-3 text-muted" th:value="${session.usuarioLogueado.email}" readonly>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Teléfono</label>
                            <input type="tel" class="form-control form-control-lg rounded-3" name="telefono" th:value="${session.usuarioLogueado.telefono}">
                        </div>

                        <hr class="my-4 text-muted opacity-25">

                        <h5 class="fw-bold mb-3">Seguridad</h5>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Nueva contraseña</label>
                            <input type="password" class="form-control form-control-lg rounded-3" name="password" placeholder="Déjalo en blanco para no cambiarla">
                            <div class="form-text mt-2">Solo rellena este campo si deseas cambiar tu contraseña actual.</div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                                Guardar cambios
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
