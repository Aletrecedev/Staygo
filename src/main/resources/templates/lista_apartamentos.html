<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StayGO - Mis Alojamientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 mb-5">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-0">Mis Alojamientos</h2>
            <p class="text-muted mb-0">Gestiona tus propiedades publicadas en StayGO.</p>
        </div>
        <a th:href="@{/apartamentos/nuevo}" class="btn btn-primary fw-bold rounded-pill px-4 py-2 shadow-sm">
            <i class="bi bi-plus-lg me-1"></i> Añadir Alojamiento
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="apartamento : ${apartamentos}">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">

                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Apartamento" style="height: 200px; object-fit: cover;">

                <div class="card-body">
                    <h5 class="card-title fw-bold mb-1" th:text="${apartamento.nombre}">Nombre</h5>
                    <p class="text-muted small mb-2"><i class="bi bi-geo-alt me-1"></i> <span th:text="${apartamento.direccion}">Ubicación</span></p>
                    <p class="card-text text-truncate small text-secondary" th:text="${apartamento.descripcion}">Descripción...</p>

                    <hr class="text-muted opacity-25">

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold fs-5 text-primary">€<span th:text="${apartamento.precioNoche}"></span><span class="text-muted small fs-6 fw-normal"> / noche</span></span>
                        <span class="badge bg-light text-dark border"><i class="bi bi-people me-1"></i> <span th:text="${apartamento.capacidad}"></span> máx</span>
                    </div>
                </div>

                <div class="card-footer bg-white border-top-0 pb-3 pt-0 d-flex gap-2">
                    <a th:href="@{/apartamentos/editar/{id}(id=${apartamento.idApartamento})}" class="btn btn-outline-primary w-50 fw-bold rounded-pill">
                        <i class="bi bi-pencil me-1"></i> Editar
                    </a>
                    <a th:href="@{/apartamentos/borrar/{id}(id=${apartamento.idApartamento})}"
                       class="btn btn-outline-danger w-50 fw-bold rounded-pill"
                       onclick="return confirm('¿Estás seguro de que quieres eliminar esta propiedad de forma permanente?')">
                        <i class="bi bi-trash me-1"></i> Borrar
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(apartamentos)}" class="text-center py-5">
        <i class="bi bi-house-add text-muted" style="font-size: 4rem;"></i>
        <h4 class="mt-3 text-secondary">Aún no tienes propiedades</h4>
        <p class="text-muted">Anímate a publicar tu primer alojamiento en StayGO.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
