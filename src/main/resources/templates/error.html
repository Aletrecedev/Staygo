<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO - ¡Ups! Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm border-0" style="max-width: 550px;">

        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
        </div>

        <h1 class="fw-bold text-dark mb-2" style="font-size: 2.5rem;">¡Ups! Te has perdido</h1>

        <p class="text-muted fs-5 mb-4">
            La página que estás buscando no existe, ha cambiado de lugar o no tienes permisos para verla.
        </p>

        <a href="/" class="btn btn-primary fw-bold rounded-pill px-4 py-2.5 shadow-sm transition-all hover-scale">
            <i class="bi bi-house-door me-2"></i> Volver a la página de inicio
        </a>

    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
