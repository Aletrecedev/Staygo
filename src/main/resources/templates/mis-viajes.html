<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StayGO - Mis Viajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h2 class="mb-4 fw-bold">Tus próximos viajes</h2>

    <div th:if="${#lists.isEmpty(reservas)}" class="text-center py-5 bg-white rounded-4 shadow-sm">
        <i class="bi bi-airplane text-muted" style="font-size: 3rem;"></i>
        <h4 class="mt-3 text-secondary">Aún no tienes viajes programados</h4>
        <p class="text-muted">¡Es el momento perfecto para planear tu próxima escapada!</p>
        <a th:href="@{/explorar}" class="btn btn-primary mt-2 rounded-pill px-4">Buscar alojamientos</a>
    </div>

    <div th:unless="${#lists.isEmpty(reservas)}" class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="reserva : ${reservas}">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Apartamento" style="height: 180px; object-fit: cover;">

                <div class="card-body">
                    <span class="badge bg-success mb-2 rounded-pill">Confirmado</span>
                    <h5 class="card-title fw-bold" th:text="${reserva.apartamento.nombre}">Nombre Apartamento</h5>
                    <p class="text-muted small mb-3"><i class="bi bi-geo-alt me-1"></i> <span th:text="${reserva.apartamento.direccion}">Dirección</span></p>

                    <div class="bg-light p-3 rounded-3 mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="small text-muted">Llegada:</span>
                            <span class="small fw-bold" th:text="${reserva.fechaInicio}">2026-04-10</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="small text-muted">Salida:</span>
                            <span class="small fw-bold" th:text="${reserva.fechaFin}">2026-04-15</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small">Total pagado:</span>
                        <span class="fw-bold fs-5 text-primary">€<span th:text="${reserva.precioTotal}">120</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
