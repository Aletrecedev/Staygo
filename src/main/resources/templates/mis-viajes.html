<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayGO - Mis Viajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 mb-5">

    <div th:if="${param.cancelada}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> Tu reserva ha sido cancelada correctamente. El importe no será cobrado.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> Error: No tienes permiso para realizar esta acción.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h2 class="mb-4 fw-bold">Tus próximos viajes</h2>

    <div th:unless="${#lists.isEmpty(reservas)}" class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="reserva : ${reservas}">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden transition-all hover-scale">

                <div class="card-body d-flex flex-column">
                    <div class="d-flex gap-2 mt-auto pt-3 border-top">
                        <a th:href="@{/apartamento/{id}(id=${reserva.apartamento.idApartamento})}" class="btn btn-outline-dark rounded-pill fw-bold flex-grow-1">
                            Ver alojamiento
                        </a>

                        <a th:href="@{/reservas/cancelar/{id}(id=${reserva.idReserva})}"
                           class="btn btn-outline-danger rounded-pill fw-bold px-3"
                           onclick="return confirm('¿Estás seguro de que quieres cancelar este viaje? Esta acción no se puede deshacer.');"
                           title="Cancelar reserva">
                            <i class="bi bi-trash3-fill"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
